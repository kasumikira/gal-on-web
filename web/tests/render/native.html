<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>native 渲染后端验证</title>
<style>
  body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 16px; color: #111; background: #fbfbfb; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #summary { font-weight: 600; margin-bottom: 8px; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ddd; padding: 2px 8px; text-align: left; }
  tr.fail td { background: #ffecec; }
  canvas { border: 1px solid #ccc; image-rendering: pixelated; width: 128px; height: 128px; }
</style>
</head>
<body>
<h1>native 渲染后端验证</h1>
<div id="summary">运行中…</div>
<table id="report"><thead><tr><th>用例</th><th>结果</th><th>说明</th></tr></thead><tbody></tbody></table>
<h2 style="font-size:14px">呈递输出</h2>
<canvas id="stage"></canvas>
<script type="module">
import createModule from '../../engine-js/tjs-runtime/tjs-runtime.js';
import { TJSInterop } from '../../engine-js/wasm-vm.js';
import { Storages } from '../../engine-js/storage.js';
import { defineNativeClass } from '#krkr/native';
import { encodeTLG } from '../fixtures/tlg-encode.js';

const WIDTH = 64, HEIGHT = 64;
// Blend encoding uses the same values as reference tTVPBBBltMethod and is passed directly
// to the native backend.
const BM = {
  Copy: 0, CopyOnAlpha: 1, Alpha: 2, AlphaOnAlpha: 3, Add: 4, Sub: 5, Mul: 6,
  Dodge: 7, Darken: 8, Lighten: 9, Screen: 10, AddAlpha: 11,
  AddAlphaOnAddAlpha: 12, AddAlphaOnAlpha: 13, AlphaOnAddAlpha: 14,
  CopyOnAddAlpha: 15, PsNormal: 16, PsAdditive: 17, PsSubtractive: 18,
  PsMultiplicative: 19, PsScreen: 20, PsOverlay: 21, PsHardLight: 22,
  PsSoftLight: 23, PsColorDodge: 24, PsColorDodge5: 25, PsColorBurn: 26,
  PsLighten: 27, PsDarken: 28, PsDifference: 29, PsDifference5: 30, PsExclusion: 31,
};
const results = [];
function record(name, pass, detail = '') {
  results.push({ name, pass: !!pass, detail });
}
function rgba(r, g, b, a = 255) { return [r, g, b, a]; }
function argb([r, g, b, a]) { return ((a << 24) | (r << 16) | (g << 8) | b) >>> 0; }
// GLSL mix(x, y, a) = x*(1-a) + y*a.
function mix(x, y, a) { return x * (1 - a) + y * a; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

const canvas = document.getElementById('stage');
function trackResources(gl) {
  const objects = new Set(), locations = new Map();
  for (const kind of ['Texture', 'Framebuffer', 'Renderbuffer', 'Buffer', 'Shader', 'Program']) {
    const create = gl[`create${kind}`].bind(gl), remove = gl[`delete${kind}`].bind(gl);
    gl[`create${kind}`] = (...args) => { const object = create(...args); if (object) objects.add(object); return object; };
    gl[`delete${kind}`] = object => { objects.delete(object); if (kind === 'Program') locations.delete(object); return remove(object); };
  }
  const getLocation = gl.getUniformLocation.bind(gl);
  gl.getUniformLocation = (program, name) => {
    const location = getLocation(program, name);
    if (location) locations.set(program, (locations.get(program) ?? 0) + 1);
    return location;
  };
  return { objects, locations };
}
const gl = canvas.getContext('webgl2', { alpha: true, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
const resources = trackResources(gl);
const module = await createModule({ getRenderCanvas: () => canvas, preinitializedWebGLContext: gl, locateFile: () => new URL('../../engine-js/tjs-runtime/tjs-runtime.wasm', import.meta.url).href });
const scratch = module._malloc(WIDTH * HEIGHT * 4);
// Read and write through the same WASM memory to avoid introducing an extra pixel-copy
// path in the test itself.
const view = () => new Uint8Array(module.HEAPU8.buffer, scratch, WIDTH * HEIGHT * 4);

function writePixels(pixels) {
  new Uint8Array(module.HEAPU8.buffer, scratch, pixels.length).set(pixels);
  return scratch;
}
function readTexture(id) {
  module._gal_render_texture_read(id, scratch);
  return Array.from(view());
}
function readCanvas() {
  module._gal_render_read_canvas(scratch);
  return Array.from(view());
}
function pixelAt(bytes, width, x, y) {
  const offset = (y * width + x) * 4;
  return bytes.slice(offset, offset + 4);
}
function compare(name, actual, expected, width, tolerance = 0) {
  let maxDiff = 0, worst = null;
  for (let i = 0; i < expected.length; i += 4) {
    for (let c = 0; c < 4; c++) {
      const diff = Math.abs(actual[i + c] - expected[i + c]);
      if (diff > maxDiff) { maxDiff = diff; worst = { index: i / 4, channel: c, actual: actual[i + c], expected: expected[i + c] }; }
    }
  }
  const pass = maxDiff <= tolerance;
  record(name, pass, pass ? `最大误差 ${maxDiff}` : `最大误差 ${maxDiff} 于像素 ${worst.index} 通道 ${worst.channel}（实际 ${worst.actual}，期望 ${worst.expected}）`);
  return pass;
}
function fillPattern(width, height, colors) {
  const out = [];
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) out.push(...colors[(y * width + x) % colors.length]);
  }
  return out;
}

const globalErrors = [];
window.addEventListener('error', event => globalErrors.push(String(event.message)));

try {
  const initResult = module._gal_render_initialize(WIDTH, HEIGHT);
  const initError = (() => {
    const length = module._gal_render_last_error(scratch, 1024);
    return length > 0 ? new TextDecoder().decode(new Uint8Array(module.HEAPU8.buffer, scratch, length)) : '';
  })();
  record('初始化 WebGL2 后端', initResult === 1, `返回 ${initResult}${initError ? `，错误：${initError}` : ''}`);
  record('纹理上限查询可用', module._gal_render_max_texture() >= 2048, `MAX_TEXTURE_SIZE=${module._gal_render_max_texture()}`);

  // 1. Create a texture, fill it, and read it back.
  {
    const tex = module._gal_render_texture_create(4, 4, 1);
    module._gal_render_texture_fill(tex, 0, 0, 4, 4, 0xFF3366CC);
    compare('创建纹理并填充（ARGB→RGBA 通道顺序）', readTexture(tex),
      fillPattern(4, 4, [rgba(0x33, 0x66, 0xCC, 0xFF)]), 4);
    // 2. Clear.
    module._gal_render_texture_clear(tex);
    compare('清空纹理', readTexture(tex), fillPattern(4, 4, [rgba(0, 0, 0, 0)]), 4);
    module._gal_render_texture_release(tex);
  }

  // Rows have padding bytes; no padding is required after the final row.
  {
    const pixels = [...rgba(255, 0, 0), ...rgba(0, 255, 0), 7, 8, 9, 10,
      ...rgba(0, 0, 255), ...rgba(255, 255, 255)];
    const expected = [...rgba(255, 0, 0), ...rgba(0, 255, 0),
      ...rgba(0, 0, 255), ...rgba(255, 255, 255)];
    const tex = module._gal_render_texture_from_pixels(2, 2, 12, writePixels(pixels));
    compare('带行距的纹理上传', readTexture(tex), expected, 2);
    module._gal_render_texture_update(tex, 0, 0, 2, 2, writePixels(expected));
    compare('紧凑行更新不继承上传行距', readTexture(tex), expected, 2);
    module._gal_render_texture_release(tex);
  }

  // 3. Copy (including texture orientation: row 0 is the top row).
  {
    const pattern = [
      ...rgba(255, 0, 0), ...rgba(0, 255, 0),
      ...rgba(0, 0, 255), ...rgba(255, 255, 255),
    ];
    const src = module._gal_render_texture_from_pixels(2, 2, 8, writePixels(pattern));
    const dst = module._gal_render_texture_create(4, 4, 1);
    module._gal_render_texture_clear(dst);
    module._gal_render_copy(dst, src, 0, 0, 2, 2, 1, 1, 0);
    const expected = fillPattern(4, 4, [rgba(0, 0, 0, 0)]);
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
      const offset = ((1 + y) * 4 + (1 + x)) * 4;
      expected.splice(offset, 4, ...pattern.slice((y * 2 + x) * 4, (y * 2 + x) * 4 + 4));
    }
    compare('复制到偏移位置并保持方向', readTexture(dst), expected, 4);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 4. Scale (nearest-neighbor must copy blocks without interpolation).
  {
    const src = module._gal_render_texture_from_pixels(2, 2, 8, writePixels([
      ...rgba(10, 20, 30), ...rgba(40, 50, 60),
      ...rgba(70, 80, 90), ...rgba(100, 110, 120),
    ]));
    const dst = module._gal_render_texture_create(4, 4, 1);
    module._gal_render_scale(dst, src, 0, 0, 2, 2, 0, 0, 4, 4, 0);
    const expected = fillPattern(4, 4, [rgba(0, 0, 0, 0)]);
    const colors = [rgba(10, 20, 30), rgba(40, 50, 60), rgba(70, 80, 90), rgba(100, 110, 120)];
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const offset = (y * 4 + x) * 4;
      expected.splice(offset, 4, ...colors[(y >> 1) * 2 + (x >> 1)]);
    }
    compare('放大 2 倍（最近邻）', readTexture(dst), expected, 4);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 5. Affine draw: rotate by 90 degrees and check that all four corners land correctly.
  {
    const src = module._gal_render_texture_from_pixels(2, 2, 8, writePixels([
      ...rgba(255, 0, 0), ...rgba(0, 255, 0),
      ...rgba(0, 0, 255), ...rgba(255, 255, 0),
    ]));
    const dst = module._gal_render_texture_create(2, 2, 1);
    module._gal_render_texture_clear(dst);
    // lt->(2,0), rt->(2,2), lb->(0,0), rb->(0,2): source rows become target columns.
    const quad = new Float32Array([2, 0, 2, 2, 0, 0, 0, 2]);
    const quadPtr = module._malloc(quad.byteLength);
    new Uint8Array(module.HEAPU8.buffer, quadPtr, quad.byteLength).set(new Uint8Array(quad.buffer));
    module._gal_render_draw_quad(dst, src, 0, 0, 2, 2, quadPtr, 0, 0, 255, 0, 0, 0, 0, 0);
    const actual = readTexture(dst);
    // lt->(2,0) samples source (0,0); rt->(2,2) samples (1,0); lb->(0,0) samples (0,1);
    // rb->(0,2) samples (1,1).
    const pass = pixelAt(actual, 2, 0, 0).join() === rgba(0, 0, 255).join()   // lb -> source (0,1), blue
      && pixelAt(actual, 2, 1, 0).join() === rgba(255, 0, 0).join()          // lt -> source (0,0), red
      && pixelAt(actual, 2, 0, 1).join() === rgba(255, 255, 0).join()        // rb -> source (1,1), yellow
      && pixelAt(actual, 2, 1, 1).join() === rgba(0, 255, 0).join();         // rt -> source (1,0), green
    record('仿射绘制（90 度旋转）', pass,
      `lt=${pixelAt(actual, 2, 0, 0)} rt=${pixelAt(actual, 2, 1, 0)} lb=${pixelAt(actual, 2, 0, 1)} rb=${pixelAt(actual, 2, 1, 1)}`);
    module._free(quadPtr);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 6. Clipping.
  {
    const dst = module._gal_render_texture_create(4, 4, 1);
    module._gal_render_texture_fill(dst, 0, 0, 4, 4, 0xFFFF0000);
    const src = module._gal_render_texture_from_pixels(4, 4, 16, writePixels(fillPattern(4, 4, [rgba(0, 0, 255, 255)])));
    module._gal_render_draw_rect(dst, src, 0, 0, 4, 4, 0, 0, 0, 0, 255, 1, 1, 3, 3, 0);
    const actual = readTexture(dst);
    const pass = pixelAt(actual, 4, 0, 0).join() === rgba(255, 0, 0).join()
      && pixelAt(actual, 4, 1, 1).join() === rgba(0, 0, 255).join()
      && pixelAt(actual, 4, 3, 3).join() === rgba(255, 0, 0).join();
    record('裁剪只在区域内绘制', pass,
      `(0,0)=${pixelAt(actual, 4, 0, 0)} (1,1)=${pixelAt(actual, 4, 1, 1)} (3,3)=${pixelAt(actual, 4, 3, 3)}`);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 7. Opacity (alpha blending; hda=0 writes target alpha).
  {
    const dst = module._gal_render_texture_create(2, 1, 1);
    module._gal_render_texture_fill(dst, 0, 0, 2, 1, 0xFF000000);
    const src = module._gal_render_texture_from_pixels(2, 1, 8, writePixels(fillPattern(2, 1, [rgba(255, 255, 255, 255)])));
    module._gal_render_draw_rect(dst, src, 0, 0, 2, 1, 0, 0, BM.Alpha, 0, 128, 0, 0, 0, 0, 0);
    const actual = readTexture(dst);
    const expectedAlpha = Math.round(255 * (128 / 255) * 1 + 255 * (1 - 128 / 255));
    compare('不透明度 128 的 alpha 混合', actual,
      fillPattern(2, 1, [rgba(128, 128, 128, Math.min(255, expectedAlpha))]), 2, 1);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 8. Special blends: addition / subtraction / multiplication.
  {
    const make = () => {
      const dst = module._gal_render_texture_create(1, 1, 1);
      module._gal_render_texture_fill(dst, 0, 0, 1, 1, 0xFF404040);
      return dst;
    };
    const src = module._gal_render_texture_from_pixels(1, 1, 4, writePixels([...rgba(0x80, 0x80, 0x80) /* straight, a=128 */]));
    const semi = module._gal_render_texture_from_pixels(1, 1, 4, writePixels([...rgba(0x80, 0x80, 0x80, 128)]));
    // Add: dst.rgb = src.rgb*opa + dst.rgb*(1 - src.a*opa)
    let dst = make();
    const quad = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
    const quadPtr = module._malloc(32);
    new Uint8Array(module.HEAPU8.buffer, quadPtr, 32).set(new Uint8Array(quad.buffer));
    module._gal_render_draw_quad(dst, semi, 0, 0, 1, 1, quadPtr, BM.AddAlpha, 1, 255, 0, 0, 0, 0, 0);
    const additive = readTexture(dst);
    const additiveAlpha = 128 / 255;
    const expectedAdd = Math.round(0x80 + 0x40 * (1 - additiveAlpha));
    record('加算混合', Math.abs(additive[0] - expectedAdd) <= 1,
      `实际 ${additive[0]}，期望 ${expectedAdd}`);
    module._gal_render_texture_release(dst);

    // Subtract: dst.rgb = dst.rgb - (1 - src.rgb)*opa
    dst = make();
    module._gal_render_draw_quad(dst, src, 0, 0, 1, 1, quadPtr, BM.Sub, 1, 255, 0, 0, 0, 0, 0);
    const subtract = readTexture(dst);
    const expectedSub = Math.max(0, Math.round(0x40 - (255 - 0x80)));
    record('减算混合', Math.abs(subtract[0] - expectedSub) <= 1,
      `实际 ${subtract[0]}，期望 ${expectedSub}`);
    module._gal_render_texture_release(dst);

    // Multiply: dst.rgb = dst.rgb * (1 - (1 - src.rgb))
    dst = make();
    module._gal_render_draw_quad(dst, src, 0, 0, 1, 1, quadPtr, BM.Mul, 1, 255, 0, 0, 0, 0, 0);
    const multiply = readTexture(dst);
    const expectedMul = Math.round(0x40 * (0x80 / 255));
    record('乘算混合', Math.abs(multiply[0] - expectedMul) <= 1,
      `实际 ${multiply[0]}，期望 ${expectedMul}`);
    module._gal_render_texture_release(dst);

    module._free(quadPtr);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(semi);
  }

  // 9. Preserve RGB for transparent pixels (do not premultiply).
  {
    const src = module._gal_render_texture_from_pixels(1, 1, 4, writePixels([...rgba(200, 100, 50, 0)]));
    const dst = module._gal_render_texture_create(1, 1, 1);
    module._gal_render_copy(dst, src, 0, 0, 1, 1, 0, 0, 0);
    compare('透明像素 RGB 原样保留', readTexture(dst), rgba(200, 100, 50, 0), 1);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 10. Copy-on-write.
  {
    const a = module._gal_render_texture_from_pixels(2, 1, 8, writePixels([...rgba(1, 2, 3, 255), ...rgba(4, 5, 6, 255)]));
    const shared = module._gal_render_texture_share(a);
    record('共享纹理不是独占', module._gal_render_texture_independent(a) === 0, `share=${shared}`);
    const writable = module._gal_render_texture_writable(a);
    record('写时复制产生独立纹理', writable !== a && module._gal_render_texture_independent(writable) === 1,
      `writable=${writable} 原=${a}`);
    const before = readTexture(writable);
    compare('复制后内容一致', before, [...rgba(1, 2, 3, 255), ...rgba(4, 5, 6, 255)], 2);
    module._gal_render_texture_fill(writable, 0, 0, 2, 1, 0xFF000000);
    compare('写入新纹理后共享副本不变', readTexture(shared),
      [...rgba(1, 2, 3, 255), ...rgba(4, 5, 6, 255)], 2);
    record('旧句柄已释放', module._gal_render_texture_width(a) === 0, `宽度=${module._gal_render_texture_width(a)}`);
    module._gal_render_texture_release(writable);
    module._gal_render_texture_release(shared);
  }

  // 11. Exceed the single-texture limit.
  {
    const max = module._gal_render_max_texture();
    const tooLarge = module._gal_render_texture_create(max + 1, 4, 1);
    record('超过纹理上限被拒绝', tooLarge === 0, `MAX=${max} 创建结果=${tooLarge}`);
    const near = module._gal_render_texture_create(2048, 2048, 1);
    record('上限内的纹理可创建', near !== 0, `2048x2048 => ${near}`);
    if (near) module._gal_render_texture_release(near);
  }

  // 12. Present to the canvas (flip Y only here).
  {
    // Put two colors in the same column: with the wrong orientation, (0,0) reads yellow.
    const image = [
      ...rgba(255, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0),
      ...rgba(0, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0),
      ...rgba(0, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0),
      ...rgba(255, 255, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0), ...rgba(0, 0, 0),
    ];
    const tex = module._gal_render_texture_from_pixels(4, 4, 16, writePixels(image));
    module._gal_render_clear(0, 0, 0, 1);
    module._gal_render_present(tex, 0);
    const canvasPixels = readCanvas();
    const pass = pixelAt(canvasPixels, WIDTH, 0, 0).join() === rgba(255, 0, 0).join()
      && pixelAt(canvasPixels, WIDTH, 0, 3).join() === rgba(255, 255, 0).join();
    record('呈递方向正确（画布 row 0 = 纹理 row 0）', pass,
      `(0,0)=${pixelAt(canvasPixels, WIDTH, 0, 0)} (0,3)=${pixelAt(canvasPixels, WIDTH, 0, 3)}`);
    module._gal_render_texture_release(tex);
  }

  // 13. Context loss and restoration.
  {
    const oldTarget = module._gal_render_texture_create(2, 2, 1);
    const beforeLoss = module._gal_render_draw_count();
    module._gal_render_context_lost();
    module._gal_render_texture_fill(oldTarget, 0, 0, 2, 2, 0xff00ff00);
    record('平台丢失通知暂停绘制', module._gal_render_draw_count() === beforeLoss);
    record('平台丢失通知清理 uniform 引用', resources.locations.size === 0);
    module._gal_render_context_restored();
    module._gal_render_texture_release(oldTarget);
    const tex = module._gal_render_texture_create(2, 2, 1);
    module._gal_render_texture_fill(tex, 0, 0, 2, 2, 0xFF00FF00);
    compare('恢复后重新创建纹理并绘制', readTexture(tex), fillPattern(2, 2, [rgba(0, 255, 0, 255)]), 2);
    module._gal_render_texture_release(tex);
  }

  // 14. Target as input: the _d family reads a target snapshot without framebuffer fetch.
  {
    const dst = module._gal_render_texture_create(2, 2, 1);
    module._gal_render_texture_fill(dst, 0, 0, 2, 2, 0x80404040);
    const src = module._gal_render_texture_from_pixels(2, 2, 8,
      writePixels(fillPattern(2, 2, [rgba(255, 0, 0, 128)])));
    module._gal_render_draw_rect(dst, src, 0, 0, 2, 2, 0, 0, BM.AlphaOnAlpha, 0, 255, 0, 0, 0, 0, 0);
    const sa = 128 / 255, da = 128 / 255;
    const outA = sa + da - sa * da;
    const t = sa / (outA + 0.0001);
    const expR = Math.round(mix(64 / 255, 1, t) * 255);
    const expG = Math.round(mix(64 / 255, 0, t) * 255);
    compare('目标作为输入（AlphaBlend_d）', readTexture(dst),
      fillPattern(2, 2, [rgba(expR, expG, expG, Math.round(outA * 255))]), 2, 2);
    module._gal_render_texture_release(src);
    module._gal_render_texture_release(dst);
  }

  // 15. Photoshop per-pixel mode.
  {
    const modes = [
      { bm: BM.PsAdditive, name: 'Ps 加算', f: (s, d, a) => mix(d, clamp01(s + d), a) },
      { bm: BM.PsSubtractive, name: 'Ps 减算', f: (s, d, a) => mix(d, clamp01(d + s - 1), a) },
      { bm: BM.PsDarken, name: 'Ps 变暗', f: (s, d, a) => mix(d, Math.min(s, d), a) },
      { bm: BM.PsLighten, name: 'Ps 变亮', f: (s, d, a) => mix(d, Math.max(s, d), a) },
      { bm: BM.PsDifference, name: 'Ps 差值', f: (s, d, a) => mix(d, Math.abs(s - d), a) },
      { bm: BM.PsExclusion, name: 'Ps 排除', f: (s, d, a) => d + (s - s * d * 2) * a },
      // The reference shader is step(0.5, x) * ((s+d)*2 - sd*4 - 1) + sd*2; sd*2 is constant.
      { bm: BM.PsOverlay, name: 'Ps 叠加',
        f: (s, d, a) => mix(d, (d >= 0.5 ? (s + d) * 2 - s * d * 4 - 1 : 0) + s * d * 2, a) },
      { bm: BM.PsHardLight, name: 'Ps 强光',
        f: (s, d, a) => mix(d, (s >= 0.5 ? (s + d) * 2 - s * d * 4 - 1 : 0) + s * d * 2, a) },
    ];
    const srcPixel = [0x80, 0x60, 0x40, 0x80];
    const dstPixel = [0x60, 0x80, 0x20, 0xFF];
    for (const mode of modes) {
      const dst = module._gal_render_texture_create(1, 1, 1);
      module._gal_render_texture_fill(dst, 0, 0, 1, 1, argb(dstPixel));
      const src = module._gal_render_texture_from_pixels(1, 1, 4, writePixels(srcPixel));
      module._gal_render_draw_rect(dst, src, 0, 0, 1, 1, 0, 0, mode.bm, 0, 255, 0, 0, 0, 0, 0);
      const weight = srcPixel[3] / 255;
      const expected = [0, 1, 2].map(i =>

          var pixel = child.getMainPixel(0, 0);
          if(Math.abs(((pixel >> 16) & 255) - 110) > 1 ||
             Math.abs(((pixel >> 8) & 255) - 70) > 1 ||
             Math.abs((pixel & 255) - 55) > 1 || child.getMaskPixel(0, 0) != 128)
            throw new Exception("gamma channel parameters mismatch");
          child.doGrayScale();
          pixel = child.getMainPixel(0, 0);
          if(((pixel >> 16) & 255) != ((pixel >> 8) & 255) ||
             ((pixel >> 8) & 255) != (pixel & 255) || child.getMaskPixel(0, 0) != 128)
            throw new Exception("grayscale channel mismatch");
        `, 'native-layer-color-adjustment'));
        record('原版 Layer gamma 与灰度：通道参数及 alpha 保留', true, '');
        const mediaBitmap = await vm.visualBitmap({width: 1, height: 1, pixels: new Uint8Array([17, 34, 51, 255])});
        try {
          vm.registerGlobal('mediaBitmap', mediaBitmap);
          await vm.dispose(await vm.source(`
            child.operateAffine(mediaBitmap, 0, 0, 1, 1, false, 0, 0, 1, 0, 0, 1, 2, 255, 1);
            if(child.getMainPixel(0, 0) != 0x112233)
              throw new Exception("browser media native affine mismatch: " + child.getMainPixel(0, 0) + ", source=" + mediaBitmap.getPixel(0, 0));
          `, 'native-media-affine'));
        } finally { await vm.dispose(mediaBitmap); }
        record('浏览器媒体上传至原版 Bitmap 并通过 Layer 仿射绘制', true, '');
        await vm.dispose(await vm.source(`
          var blur = new Layer(nativeWindow, primary);
          blur.setSize(4, 4); blur.setImageSize(4, 4);
          blur.type = 1;
          blur.fillRect(0, 0, 4, 4, 0xff000000);
          blur.setMainPixel(1, 1, 0xffffff);
          blur.doBoxBlur(1, 1);
          var center = blur.getMainPixel(1, 1);
          var expected = 255 / 9;
          if(Math.abs(((center >> 16) & 255) - expected) > 2 ||
             Math.abs(((center >> 8) & 255) - expected) > 2 ||
             Math.abs((center & 255) - expected) > 2)
            throw new Exception("BoxBlur average mismatch: " + center);
          blur.doBoxBlur(1, 1);
          if(blur.getMainPixel(1, 1) == 0)
            throw new Exception("BoxBlur second pass returned black");
          invalidate blur;
        `, 'native-box-blur'));
        record('原版 Layer.doBoxBlur（BoxBlur/BoxBlurAlpha 与 u_sample 偏移）', true, '');
        // System.graphicCache* is exercised through the TJSInterop bridge
        // instead of a script System global: this page only registers the
        // native Layer/Bitmap/Font globals, not the JS System class.
        const savedLimit = vm.graphicCacheLimit();
        try {
          // The platform ceiling must be non-zero before a script limit can
          // enable the cache (SysInitImpl.cpp derives it from physical memory).
          const ceiling = vm.setGraphicCacheSystemLimit(256 * 1024 * 1024);
          record('图形缓存上限可由宿主提供（SysInitImpl 等价初始化）',
            ceiling === 256, `ceiling=${ceiling}MB`);
          vm.setGraphicCacheLimit(32 * 1024 * 1024);
          record('System.graphicCacheLimit 直连 native 图形缓存',
            vm.graphicCacheLimit() === 32 * 1024 * 1024, `limit=${vm.graphicCacheLimit()}`);
          vm.clearGraphicCache();
          await vm.touchImages([], 1024, 0);
          // Missing storage is swallowed by TVPTouchImages like the reference;
          // this also covers the JSPI suspension path.
          await vm.touchImages(['missing.png'], 1024, 0);
          record('System.clearGraphicCache/touchImages 直连 native 图形缓存', true, '');
        } finally {
          vm.setGraphicCacheLimit(savedLimit);
        }
      } finally { await vm.dispose(window); }
    } catch(error) {
      record('原版 TJS 视觉链执行', false, String(error));
    } finally {
      const visualModule = vm.module;
      await vm.dispose();
      visualModule._gal_render_shutdown();
      record('原版窗口、图层和字体退出后释放 GL 资源', visualResources.objects.size === 0 && visualResources.locations.size === 0,
        `objects=${visualResources.objects.size}, programs=${visualResources.locations.size}`);
    }
  }
  module._gal_render_shutdown();
  record('关闭设备清理全部 GL 对象和 uniform', resources.objects.size === 0 && resources.locations.size === 0,
    `objects=${resources.objects.size}, programs=${resources.locations.size}`);
  const restarted = module._gal_render_initialize(WIDTH, HEIGHT);
  const restartedTexture = module._gal_render_texture_create(2, 2, 1);
  record('关闭后重建保留有效纹理句柄', restarted === 1 && restartedTexture > 0, `id=${restartedTexture}`);
  if (restartedTexture > 0) {
    module._gal_render_texture_fill(restartedTexture, 0, 0, 2, 2, 0x80123456);
    compare('关闭后重建可以绘制', readTexture(restartedTexture), fillPattern(2, 2, [rgba(0x12, 0x34, 0x56, 0x80)]), 2);
    module._gal_render_texture_release(restartedTexture);
  }

  const drawCount = module._gal_render_draw_count();
  record('绘制调用计数可用', Number(drawCount) > 0, `draws=${drawCount}`);
  const glError = gl.getError();
  record('WebGL 无错误', glError === 0, `gl.getError()=${glError}`);
  const backendError = (() => {
    const length = module._gal_render_last_error(scratch, 512);
    return length > 0 ? new TextDecoder().decode(new Uint8Array(module.HEAPU8.buffer, scratch, length)) : '';
  })();
  record('后端无编译错误', backendError === '', backendError);
} catch (error) {
  record('执行异常', false, String(error && error.stack || error));
} finally {
  module._free(scratch);
  module._gal_render_shutdown();
}

const failed = results.filter(item => !item.pass);
const summary = `${results.length - failed.length}/${results.length} 通过`;
document.getElementById('summary').textContent = failed.length ? `FAIL — ${summary}` : `PASS — ${summary}`;
const body = document.querySelector('#report tbody');
for (const item of results) {
  const row = document.createElement('tr');
  if (!item.pass) row.className = 'fail';
  row.innerHTML = `<td>${item.name}</td><td>${item.pass ? '通过' : '失败'}</td><td>${item.detail ?? ''}</td>`;
  body.appendChild(row);
}
window.renderTestResult = { passed: results.length - failed.length, total: results.length, failures: failed, results, globalErrors };

</script>
</body>
