<h1>GPU 与原版 Kirikiri 像素对比</h1>
<p>基准由原版 C++ 源码生成；几何平滑采样的基准是理想双线性（原版 GL 后端用硬件 <code>GL_LINEAR</code>），软件内核 <code>TVPInterpLinTransCopy</code> 的偏差单独列在“档案”列。颜色差异包括 alpha=0 时的隐藏 RGB；容差默认 1，可通过 <code>?tolerance=0</code> 修改。</p>
